services:
  interview-demo:
    build: .
    image: interview-avatar-demo:local
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      XMOV_APP_ID: ${XMOV_APP_ID:-}
      XMOV_APP_SECRET: ${XMOV_APP_SECRET:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8766}:8765"
    read_only: true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
